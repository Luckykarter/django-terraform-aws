version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: eu-west-2
    ECS_CLUSTER_NAME: django-dev-cluster
    ECS_TASK_DEFINITION: django-app-dev
    ECS_CONTAINER_NAME: django-app
    ECS_SUBNETS: ""
    ECS_SECURITY_GROUPS: ""

phases:
  build:
    commands:
      - echo Running Django migrations as one-off ECS task...
      - |
        TASK_ARN=$(aws ecs run-task \
          --cluster $ECS_CLUSTER_NAME \
          --launch-type FARGATE \
          --task-definition $ECS_TASK_DEFINITION \
          --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUPS],assignPublicIp=ENABLED}" \
          --overrides "{\"containerOverrides\":[{\"name\":\"$ECS_CONTAINER_NAME\",\"command\":[\"python\",\"manage.py\",\"migrate\",\"--noinput\"]}]}" \
          --query 'tasks[0].taskArn' \
          --output text)

        echo "Migration task ARN: $TASK_ARN"

        aws ecs wait tasks-stopped \
          --cluster $ECS_CLUSTER_NAME \
          --tasks $TASK_ARN

        EXIT_CODE=$(aws ecs describe-tasks \
          --cluster $ECS_CLUSTER_NAME \
          --tasks $TASK_ARN \
          --query 'tasks[0].containers[0].exitCode' \
          --output text)

        echo "Migration task exit code: $EXIT_CODE"

        if [ "$EXIT_CODE" != "0" ]; then
          echo "Migration failed"
          exit 1
        fi